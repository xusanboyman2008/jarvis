<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision.Core // 3D Spatial Model Playground</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js 3D WebGL Engine & GLTF Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- MediaPipe High-Accuracy Vision Tasks & Hands Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

  <header>
    <div class="logo-area">
      <div id="status-indicator" class="status-dot"></div>
      <h2 style="font-size: 14px; font-weight: 800; letter-spacing: 1px;">VISION.CORE // MAX PLAYGROUND</h2>
    </div>
    <div id="system-status-text" style="font-size: 11px; color: #94a3b8;">
      STATUS: READY
    </div>
    <div class="header-actions">
      <!-- 🎵 Cyberpunk Synthwave Music Player -->
      <div class="music-bar">
        <button id="btn-music-prev" class="music-btn" title="Previous Track">⏮️</button>
        <button id="btn-music-toggle" class="music-btn" title="Play / Pause">▶️</button>
        <button id="btn-music-next" class="music-btn" title="Next Track">⏭️</button>
        <canvas id="audio-visualizer-canvas" class="audio-bars-canvas" width="48" height="16"></canvas>
        <div id="track-title-text" class="track-info">JARVIS Cyberpunk Synth</div>
      </div>

      <button id="btn-open-chooser" class="hdr-btn" style="border-color:#ff007f; color:#ff007f;">🖼️ 3D MEDIA CHOOSER [G]</button>
      <a href="stage.html" class="hdr-btn" style="text-decoration:none; display:inline-flex; align-items:center; background:rgba(0,229,255,0.18); border:1px solid #00e5ff; color:#00e5ff; font-weight:700; padding:6px 12px; border-radius:6px; font-size:12px;">✨ GLASS STAGE</a>
      <button id="btn-fullscreen" class="hdr-btn">⛶ FULLSCREEN</button>
    </div>
  </header>

  <main class="main-container">
    <!-- Maximized Full-Screen Viewport Panel -->
    <div class="viewport-panel" id="viewport-panel">
      <!-- Layer 1: Hardware-Accelerated Mirrored Video Feed -->
      <video id="input-video" playsinline autoplay muted></video>
      <!-- Layer 2: Three.js WebGL 3D Model Layer -->
      <canvas id="webgl-canvas" width="1280" height="720"></canvas>
      <!-- Layer 3: Interactive 2D Spatial HUD & Skeleton Canvas -->
      <canvas id="output-canvas" width="1280" height="720"></canvas>

      <!-- 🖼️ 3D INTERACTIVE MEDIA & IMAGE SCROLLER / CAROUSEL CHOOSER MODAL -->
      <div id="media-chooser-modal" class="media-chooser-overlay">
        <div class="media-chooser-container">
          <div class="chooser-header">
            <div class="chooser-title">
              <span>🖼️</span>
              <span>JARVIS 3D SPATIAL MEDIA & IMAGE CHOOSER</span>
            </div>
            <div class="chooser-filters">
              <button class="filter-btn active" data-filter="all">ALL</button>
              <button class="filter-btn" data-filter="models">3D MODELS</button>
              <button class="filter-btn" data-filter="props">IMAGES & PROPS</button>
            </div>
            <button id="btn-close-chooser" class="chooser-close" title="Close Chooser">✕</button>
          </div>

          <button id="carousel-prev-btn" class="carousel-nav-btn prev">‹</button>
          <div id="carousel-viewport" class="carousel-viewport">
            <!-- Dynamically populated carousel cards -->
          </div>
          <button id="carousel-next-btn" class="carousel-nav-btn next">›</button>

          <div style="font-size:11px; color:#94a3b8; margin-top:14px; text-align:center; display:flex; gap:16px;">
            <span>👋 <strong>Hand Wave:</strong> Scroll left/right</span>
            <span>🤏 <strong>Pinch / Click:</strong> Stage 3D Model or Image</span>
            <span>⌨️ <strong>Shortcut:</strong> Press [G] to toggle chooser</span>
          </div>
        </div>
      </div>

      <!-- HUD Top Telemetry Overlay -->
      <div class="hud-overlay">
        <div class="hud-pill">
          <span>FPS:</span>
          <span id="fps-val" class="val">0</span>
        </div>
        <div class="hud-pill">
          <span>HANDS:</span>
          <span id="hands-count-val" class="val">0</span>
        </div>
        <div class="hud-pill">
          <span>INTERACTION:</span>
          <span id="interaction-val" class="val" style="color: #00ffcc;">IDLE</span>
        </div>
      </div>

      <!-- Pointed / Interaction Banner -->
      <div id="pointed-object-banner" class="gesture-banner" style="display: block;">
        READY
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
